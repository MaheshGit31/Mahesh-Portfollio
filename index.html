<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahesh Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: oversized name header, 6-col bento grid of tilt cards, rain behind everything, cursor glow */
:root{
  --bg:#f3f1ee; --fg:#14141c; --mute:#5c5c6b; --line:#d9d6d0; --card:#ffffff;
  --hot:#e8470f; --rain:#3a6df0; --glow:#e8470f33;
  --f-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0b12; --fg:#f2f0ea; --mute:#8d8fa3; --line:#23253a; --card:#11131f;
  --hot:#ff6a2b; --rain:#9fb8ff; --glow:#ff6a2b2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0b12; --fg:#f2f0ea; --mute:#8d8fa3; --line:#23253a; --card:#11131f;
  --hot:#ff6a2b; --rain:#9fb8ff; --glow:#ff6a2b2e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:0;will-change:transform}
.wrap{position:relative;z-index:1;max-width:1180px;margin-inline:auto;padding-inline:20px;padding-block:20px 56px}
a{color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px;border-radius:6px}

.top{display:flex;justify-content:flex-end}
.tbtn{font:600 16px var(--f-mono);background:none;border:1px solid var(--line);color:var(--fg);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.tbtn:hover{border-color:var(--hot);color:var(--hot)}

h1{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,13vw,10.5rem);line-height:.86;letter-spacing:-.045em;margin:clamp(12px,3vw,32px) 0 clamp(28px,5vw,56px);text-wrap:balance}
h1 .ch{display:inline-block;transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .2s;cursor:default}
h1 .ch:hover{transform:translateY(-.12em) rotate(-6deg);color:var(--hot)}
h1 em{font-style:normal;-webkit-text-stroke:2px var(--fg);color:transparent}
h1 em .ch:hover{color:var(--hot);-webkit-text-stroke-color:var(--hot)}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.card{--mx:50%;--my:50%;position:relative;grid-column:span 2;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;
  text-decoration:none;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .2s ease-out,border-color .2s,box-shadow .3s;will-change:transform;animation:in .6s both}
.card.wide{grid-column:span 4}
.card:hover{border-color:var(--hot);box-shadow:0 24px 60px -24px var(--hot)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(380px circle at var(--mx) var(--my),#ffffff22,transparent 55%);opacity:0;transition:opacity .2s;mix-blend-mode:overlay}
.card:hover::after{opacity:1}
@keyframes in{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.poster{position:relative;height:190px;overflow:hidden;display:grid;place-items:center;background:var(--p1)}
.wide .poster{height:230px}
.poster::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at var(--mx) var(--my),var(--p2),transparent 55%)}
.glyph{position:relative;font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,9vw,7.5rem);line-height:1;letter-spacing:-.06em;color:#fff;
  mix-blend-mode:overlay;transform:translate(calc(var(--px,0) * 22px),calc(var(--py,0) * 22px));transition:transform .15s ease-out;text-align:center;padding-inline:8px}
.glyph.sm{font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.04em}
.arrow{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:16px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.card:hover .arrow{transform:rotate(45deg) scale(1.15)}
.info{padding:18px 20px 20px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.info h2{margin:0;font-family:var(--f-display);font-size:1.55rem;line-height:1.1;letter-spacing:-.025em;text-wrap:balance}
.host{margin-top:auto;padding-top:8px;font:400 12px var(--f-mono);color:var(--hot);overflow-wrap:anywhere}

.support{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px 28px;padding:26px 28px;border-radius:22px;background:var(--hot);color:#12060a;text-decoration:none;transition:transform .2s}
.support:hover{transform:scale(1.012) rotate(-.4deg)}
.support h3{margin:0;font-family:var(--f-display);font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:-.035em;line-height:1}
.support .go{font:600 14px var(--f-mono);background:#12060a;color:#fff;padding:12px 20px;border-radius:99px;transition:transform .2s}
.support:hover .go{transform:translateX(6px)}

@media (max-width:900px){.card,.card.wide{grid-column:span 3}.card.wide{grid-column:span 6}}
@media (max-width:620px){.card,.card.wide{grid-column:span 6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#glow{display:none}}
</style>

</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>

<div class="wrap">
  <div class="top"><button class="tbtn" id="theme" type="button" aria-label="switch light or dark theme">◐</button></div>

  <h1 id="title">mahesh<br><em>builds</em> stuff</h1>

  <div class="grid" id="grid"></div>

  <a class="support" href="https://supportme.maheshofficial.uk/" target="_blank" rel="noopener">
    <h3>support me</h3>
    <span class="go">→</span>
  </a>
</div>

<script>
// add new projects here, the page does the rest
var PROJECTS = [
  {name:"Portfolio", url:"https://portfolio.maheshofficial.uk", glyph:"M.", p1:"#e8470f", p2:"#ffb347", wide:true},
  {name:"Deslopifier", url:"https://deslopify.maheshofficial.uk/", glyph:"sl0p", p1:"#2b2f77", p2:"#7c5cff", small:true},
  {name:"Cutout", url:"https://cutout.maheshofficial.uk/", alt:"https://removebg.maheshofficial.uk/", glyph:"✂", p1:"#0f6b5c", p2:"#3ee0b5"},
  {name:"Shirt Studio", url:"https://studio.maheshofficial.uk/", glyph:"Tee", p1:"#1b4fd8", p2:"#6fd3ff", wide:true},
  {name:"Just sign up already!", url:"https://justsignup.maheshofficial.uk/", glyph:"sign up!!", p1:"#b0124a", p2:"#ff7aa8", small:true}
];
var $ = function(s){return document.querySelector(s)};
var grid = $("#grid");
var host = function(u){return u.replace(/^https?:\/\//,"").replace(/\/$/,"")};

PROJECTS.forEach(function(p,i){
  var a = document.createElement("a");
  a.className = "card" + (p.wide?" wide":"");
  a.href = p.url; a.target = "_blank"; a.rel = "noopener";
  a.style.animationDelay = (i*70)+"ms";
  a.style.setProperty("--p1",p.p1); a.style.setProperty("--p2",p.p2);
  a.innerHTML = '<div class="poster"><span class="arrow">↗</span><div class="glyph'+(p.small?' sm':'')+'"></div></div>'+
    '<div class="info"><h2></h2><span class="host"></span></div>';
  a.querySelector(".glyph").textContent = p.glyph;
  a.querySelector("h2").textContent = p.name;
  a.querySelector(".host").textContent = host(p.url) + (p.alt ? "  ·  "+host(p.alt) : "");
  grid.appendChild(a);
});

// title letters hop on hover
(function(){
  function wrap(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3){
        var f=document.createDocumentFragment();
        n.textContent.split("").forEach(function(c){
          if(c===" "){f.appendChild(document.createTextNode(" "));return}
          var s=document.createElement("span");s.className="ch";s.textContent=c;f.appendChild(s)});
        n.replaceWith(f);
      } else if(n.nodeType===1 && n.tagName!=="BR"){wrap(n)}
    });
  }
  wrap($("#title"));
})();

// cursor glow, card tilt, poster parallax
var glow = $("#glow"), mx = -999, my = -999, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
addEventListener("pointermove", function(e){mx=e.clientX; my=e.clientY; glow.style.transform="translate("+mx+"px,"+my+"px)"});
grid.addEventListener("pointermove", function(e){
  if(e.pointerType==="touch") return;
  var c = e.target.closest(".card"); if(!c) return;
  var r = c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  c.style.setProperty("--mx",(x*100)+"%"); c.style.setProperty("--my",(y*100)+"%");
  c.style.setProperty("--px",(x-.5).toFixed(3)); c.style.setProperty("--py",(y-.5).toFixed(3));
  if(!reduce) c.style.transform="perspective(900px) rotateY("+((x-.5)*10)+"deg) rotateX("+((.5-y)*10)+"deg) translateY(-6px)";
});
grid.addEventListener("pointerout", function(e){
  var c = e.target.closest(".card"); if(c && !c.contains(e.relatedTarget)){c.style.transform="";c.style.setProperty("--px",0);c.style.setProperty("--py",0)}
});

// rain from the top of the screen, cursor pushes drops aside, ripples at the bottom
(function(){
  var cv=$("#rain"), g=cv.getContext("2d"), W,H, drops=[], rip=[], col="#888";
  function mk(init){
    var z=.3+Math.random()*.7;
    return {x:Math.random()*(W+160)-80,y:init?Math.random()*H:-30-Math.random()*200,z:z,len:12+z*26,v:8+z*14};
  }
  function size(){
    var dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(240,Math.max(80,W/6)));
    while(drops.length<n) drops.push(mk(true));
    drops.length=n;
  }
  size(); addEventListener("resize",size);
  function frame(){
    col=getComputedStyle(document.documentElement).getPropertyValue("--rain").trim()||col;
    g.clearRect(0,0,W,H); g.strokeStyle=col; g.lineCap="round";
    for(var i=0;i<drops.length;i++){
      var d=drops[i], dx=d.x-mx, dy=d.y-my, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){d.x+=dx/(dist||1)*(1-dist/120)*6}
      d.x+=1.1*d.z; d.y+=d.v;
      g.globalAlpha=.12+d.z*.38; g.lineWidth=.6+d.z;
      g.beginPath(); g.moveTo(d.x,d.y); g.lineTo(d.x-2*d.z,d.y-d.len); g.stroke();
      if(d.y>H){
        if(d.z>.65&&Math.random()<.45) rip.push({x:d.x,y:H-3,r:1,a:.45});
        drops[i]=mk(false);
      }
    }
    for(var j=rip.length-1;j>=0;j--){
      var s=rip[j]; s.r+=.7; s.a-=.03;
      if(s.a<=0){rip.splice(j,1);continue}
      g.globalAlpha=s.a; g.lineWidth=1; g.beginPath(); g.ellipse(s.x,s.y,s.r*2.4,s.r*.7,0,0,6.283); g.stroke();
    }
    g.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  if(reduce){cv.style.display="none"} else frame();
})();

$("#theme").onclick = function(){
  var r=document.documentElement, dark=(r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark?"light":"dark";
};
</script>
</body>
</html>
